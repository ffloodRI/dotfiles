# use Ctrl-a as the tmux prefix instead of Ctrl-b
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

set -g mouse on
set-option -g set-clipboard on

setw -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"

set -g terminal-overrides ',xterm*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
bind -n M-H previous-window
bind -n M-L next-window

bind -n M-J select-pane -t :.-
bind -n M-K select-pane -t :.+

set-option -ga terminal-overrides ",xterm-256color:RGB"

# Set the status bar background, foreground color
set-option -g status-bg colour235
set-option -g status-fg colour136

unbind-key -n M-j
unbind-key -n M-k

bind-key q kill-session

bind-key p display-popup -w 75% -h 75% -d "#{pane_current_path}"

bind-key g display-popup -E -w 75% -h 75% -d "#{pane_current_path}" "lazygit"

bind-key k display-popup -E -w 75% -h 75% -d "#{pane_current_path}" "go test ./...; sleep 5"

bind-key r display-popup -E -w 75% -h 75% -d "#{pane_current_path}" "go run ."

bind-key n display-popup -E -w 75% -h 75% -d "#{pane_current_path}" "nvim notes.md"

# use vim-style keybinding for tmux copy-mode
set -g mode-keys vi

# Start selection (like visual mode)
bind-key -T copy-mode-vi v send -X begin-selection

# Toggle rectangle selection (optional)
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# Yank selection and exit copy mode
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Optional: Enter copy mode with prefix + [
bind [ copy-mode

# Use / and ? for searching (already vi-like, but explicit)
bind-key -T copy-mode-vi / send -X search-forward
bind-key -T copy-mode-vi ? send -X search-backward

# Repeat last search
bind-key -T copy-mode-vi n send -X search-again
bind-key -T copy-mode-vi N send -X search-reverse
